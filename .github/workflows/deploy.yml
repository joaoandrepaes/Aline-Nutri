name: Publicar site na Hostinger

# Envia o site por FTP para a Hostinger sempre que algo entra na branch main.
# Também pode ser rodado à mão em Actions > Publicar site na Hostinger > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Conferir se a senha do FTP foi cadastrada
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Falta cadastrar o segredo FTP_PASSWORD em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Instalar o lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Mostrar o certificado do servidor FTP
        run: |
          openssl s_client -starttls ftp -connect 212.85.9.154:21 -servername 212.85.9.154 </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -ext subjectAltName || true
          echo "reverso: $(getent hosts 212.85.9.154)"
          dig +short -x 212.85.9.154 || true
          openssl s_client -starttls ftp -connect 212.85.9.154:21 </dev/null 2>/dev/null | grep -i -E "^220|hstgr" | head -5 || true

      # Envia por FTPS (FTP criptografado, com verificação de certificado).
      # Só envia arquivos novos ou alterados; não apaga nada do servidor.
      - name: Enviar arquivos por FTPS
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          cat > "$RUNNER_TEMP/deploy.lftp" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 3
          set net:timeout 30
          debug 2
          open --env-password -u u745141359 ftp://212.85.9.154
          cls -1 public_html/ | head -5
          mirror --reverse --verbose --only-newer --no-perms --exclude-glob .git* --exclude-glob .github/ --exclude-glob README.md --exclude-glob vercel.json ./ public_html/
          quit
          LFTP
          lftp -f "$RUNNER_TEMP/deploy.lftp"
